{% extends "index.html" %}{% block conteudo %}<section class="pagina"><h1>Painel administrativo</h1><p>Gerencie produtos, funcionários e acompanhe os pedidos.</p><div class="painel-duplo"><section class="form-card"><h2>Cadastrar produto</h2><form id="form-produto" enctype="multipart/form-data"><label>Nome<input name="nome" required></label><label>Descrição<textarea name="descricao" required></textarea></label><label>Categoria<select name="categoria"><option>Pratos</option><option>Bebidas</option><option>Combos</option><option>Sobremesas</option></select></label><label>Preço (R$)<input name="preco" type="number" step="0.01" min="0.01" required></label><label>Foto do produto<input name="imagem" type="file" accept="image/png,image/jpeg,image/webp"></label><button class="botao">Cadastrar prato</button></form><p id="mensagem-admin" role="status"></p></section><section><h2>Produtos cadastrados</h2><div id="produtos-admin" class="lista"></div></section></div><section><h2>Resumo de vendas</h2><div id="resumo-admin"></div><h2>Funcionários</h2><div id="funcionarios-admin"></div><section class="form-card"><h3>Cadastrar funcionário</h3><form id="form-funcionario">
<label>Nome<input name="nome" required></label>
<label>E-mail<input type="email" name="email" required></label>
<label>Senha<input type="password" name="senha" minlength="8" required></label>
<label>Função<select name="tipo"><option value="cozinheiro">Cozinheiro</option><option value="administrador">Administrador</option></select></label>
<label>Turno<input name="turno" placeholder="Ex.: Manhã"></label>
<label>Especialidade<input name="especialidade" placeholder="Ex.: Lanches"></label>
<button class="botao" type="submit">Cadastrar funcionário</button></form><p id="mensagem-funcionario" role="status"></p></section></section></section><script src="{{ url_for('static',filename='admin.js') }}"></script>{% endblock %}
