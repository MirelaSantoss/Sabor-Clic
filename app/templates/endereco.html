{% extends "index.html" %}
{% block conteudo %}
<section class="pagina-autenticacao">
    <div class="faixa-etapa">
        <h1>Passo: 2</h1>
    </div>

    <div class="auth-container auth-container-largo">
        <div class="auth-card">
            <h2>Endereço de entrega</h2>
            <form action="/endereco" method="POST">
                <label class="campo-com-icone">
                    <span class="icone-campo" aria-hidden="true"><svg class="icone-svg" aria-hidden="true"><use href="#ico-pin"></use></svg></span>
                    <input type="text" name="rua" placeholder="Logradouro (Rua / Avenida)" required>
                </label>
                <div class="grade-campos-dupla">
                    <label class="campo-com-icone">
                        <span class="icone-campo" aria-hidden="true"><svg class="icone-svg" aria-hidden="true"><use href="#ico-home"></use></svg></span>
                        <input type="text" name="bairro" placeholder="Bairro" required>
                    </label>
                    <label class="campo-com-icone">
                        <span class="icone-campo" aria-hidden="true"><svg class="icone-svg" aria-hidden="true"><use href="#ico-building"></use></svg></span>
                        <input type="text" name="cidade" placeholder="Cidade" required>
                    </label>
                </div>
                <div class="grade-campos-tripla">
                    <label class="campo-com-icone">
                        <span class="icone-campo" aria-hidden="true"><svg class="icone-svg" aria-hidden="true"><use href="#ico-hash"></use></svg></span>
                        <input type="text" name="numero" placeholder="Número" required>
                    </label>
                    <label class="campo-com-icone">
                        <span class="icone-campo" aria-hidden="true"><svg class="icone-svg" aria-hidden="true"><use href="#ico-mail"></use></svg></span>
                        <input type="text" name="cep" placeholder="CEP" required>
                    </label>
                    <label class="campo-com-icone">
                        <span class="icone-campo" aria-hidden="true"><svg class="icone-svg" aria-hidden="true"><use href="#ico-pin"></use></svg></span>
                        <input type="text" name="estado" placeholder="Estado (UF)" required>
                    </label>
                </div>
                <button class="botao botao-auth" type="submit">Finalizar cadastro</button>
            </form>
        </div>

        <div class="auth-rodape">
            <a class="botao-voltar" href="/formulario">← Voltar</a>
        </div>
    </div>
</section>
{% endblock %}
