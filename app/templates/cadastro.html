{% extends "index.html" %}

{% block conteudo %}

<h2>Formulário de Cadastro</h2>

<form action="/formulario" method="POST" onsubmit="return validarFormulario()"> <!--formulario para cadastro--> 

    <h3>Dados do cliente</h3>

    <label>Nome:</label>
    <input type="text" name="nome" id="nome"> <!--name - para python, id - para JavaScript--> 

    <br><br> <!--quebra de linha--> 

    <label>Telefone:</label>
    <input type="text" name="telefone" id="telefone">

    <br><br>

    <label>CPF:</label>
    <input type="text" name="cpf" id="cpf">

    <br><br>

    <label>Data de nascimento:</label>
    <input type="date" name="data_nascimento" id="data_nascimento">

    <br><br>

    <label>Email:</label>
    <input type="email" name="email" id="email">

    <br><br>

    <label>Senha:</label>
    <input type="password" name="senha" id="senha">

    <br><br>

    <label>Gênero:</label>
    <select name="genero" id="genero"> <!--cria uma lista de opções para o usuário escolher o gênero-->
        <option value="">Selecione</option>
        <option value="Feminino">Feminino</option>
        <option value="Masculino">Masculino</option>
    </select>

    <h3>Endereço</h3>

    <label>Rua:</label>
    <input type="text" name="rua" id="rua">

    <br><br>

    <label>Número:</label>
    <input type="text" name="numero" id="numero">

    <br><br>

    <label>Bairro:</label>
    <input type="text" name="bairro" id="bairro">

    <br><br>

    <label>Cidade:</label>
    <input type="text" name="cidade" id="cidade">

    <br><br>

    <label>Estado:</label>
    <input type="text" name="estado" id="estado">

    <br><br>

    <label>CEP:</label>
    <input type="text" name="cep" id="cep">

    <br><br>

    <button type="submit">Cadastrar</button>

</form>

<script src="{{ url_for('static', filename='js/cadastro.js') }}"></script>

{% endblock %}
