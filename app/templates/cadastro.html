{% extends "index.html" %}
{% block conteudo %}
<section class="form-pagina">
    <div class="form-card">
        <h1>Formulário de Cadastro</h1>
        <form action="/formulario" method="POST" onsubmit="return validarFormulario()">
            <h2>Dados do cliente</h2>
            <label>Nome completo
                <input type="text" name="nome" id="nome" required>
            </label>
            <label>Telefone / WhatsApp
                <input type="text" name="telefone" id="telefone" required>
            </label>
            <label>CPF
                <input type="text" name="cpf" id="cpf" required>
            </label>
            <label>Data de nascimento
                <input type="date" name="data_nascimento" id="data_nascimento" required>
            </label>
            <label>E-mail
                <input type="email" name="email" id="email" maxlength="120" required>
            </label>
            <label>Senha (mínimo 8 caracteres, letras e números)
                <input type="password" name="senha" id="senha" minlength="8" required>
            </label>
            <label>Gênero
                <select name="genero" id="genero" required>
                    <option value="">Selecione</option>
                    <option value="Feminino">Feminino</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Outro">Outro</option>
                </select>
            </label>
            <button class="botao" type="submit">Continuar</button>
        </form>
        <script src="{{ url_for('static', filename='cadastro.js') }}"></script>
    </div>
</section>
{% endblock %}
