{% extends "index.html" %}
{% block conteudo %}
<section class="pagina">
    <h1>Locação de Bancadas Gastronômicas</h1>
    <p>Área para chefs parceiros e empreendedores gastronômicos: escolha uma estação equipada e agende seu horário de produção.</p>

    <section>
        <h2>Estações disponíveis</h2>
        <div id="catalogo-bancadas" class="grade-produtos"></div>
    </section>

    <div class="painel-duplo">
        <section class="form-card">
            <h2>Agendar horário de bancada</h2>
            <form id="form-reserva-bancada">
                <label>Bancada equipada
                    <select id="select-bancada" name="id_bancada" required></select>
                </label>
                <label>Início da locação
                    <input type="datetime-local" name="data_hora_inicio" required>
                </label>
                <label>Fim da locação
                    <input type="datetime-local" name="data_hora_fim" required>
                </label>
                <button class="botao" type="submit">Solicitar reserva</button>
            </form>
            <p id="mensagem-reserva" role="status"></p>
        </section>
        <section>
            <h2>Minhas reservas agendadas</h2>
            <div id="minhas-reservas" class="lista"></div>
        </section>
    </div>

    <script src="{{ url_for('static', filename='bancadas.js') }}"></script>
</section>
{% endblock %}
