{% extends "index.html" %}
{% block conteudo %}
<section class="pagina cozinha">
    <div class="cozinha-cabecalho cozinha-cabecalho-figma">
        <div class="kds-logo-bloco">
            <span class="kds-icone-chef" aria-hidden="true">👨‍🍳</span>
            <h1>KITCHEN DISPLAY</h1>
        </div>
        <div class="kds-central-bloco">
            <span class="kds-icone-monitor" aria-hidden="true">📊</span>
            <p id="contador-kds" class="kds-pilula-contador">#0 Pedidos a serem entregues</p>
        </div>
        <div class="kds-relogio-bloco">
            <span class="kds-icone-relogio" aria-hidden="true">⏱</span>
            <span id="relogio">00:00</span>
        </div>
    </div>

    <div id="kds" class="kds-colunas"></div>
</section>

<dialog id="modal-tempo-kds" class="modal-admin">
    <form id="form-tempo-kds" class="form-card">
        <h2 id="titulo-modal-kds">Editar Tempo e Observações</h2>
        <input type="hidden" id="kds-pedido-id">
        <div class="pedido-kds-acoes">
            <button type="button" class="botao-secundario preset-tempo" data-min="15">15 min</button>
            <button type="button" class="botao-secundario preset-tempo" data-min="20">20 min</button>
            <button type="button" class="botao-secundario preset-tempo" data-min="30">30 min</button>
            <button type="button" class="botao-secundario preset-tempo" data-min="45">45 min</button>
        </div>
        <label>Tempo estimado de preparo (1 a 480 minutos)
            <input type="number" id="kds-input-minutos" min="1" max="480" required>
        </label>
        <label>Observações da comanda
            <textarea id="kds-input-observacoes" maxlength="255"></textarea>
        </label>
        <div class="pedido-kds-acoes">
            <button type="submit" class="botao">Salvar</button>
            <button type="button" id="fechar-modal-kds" class="botao-secundario">Cancelar</button>
        </div>
    </form>
</dialog>

<script src="{{ url_for('static', filename='kds.js') }}"></script>
{% endblock %}
